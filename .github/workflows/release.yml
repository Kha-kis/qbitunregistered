name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from qbitunregistered import __version__

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          package_version = project["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if len({tag_version, package_version, __version__}) != 1:
              raise SystemExit(
                  "Release versions do not match: "
                  f"tag={tag_version!r}, project={package_version!r}, package={__version__!r}"
              )
          PY
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=qbitunregistered --cov-report=term-missing --cov-fail-under=60
      - name: Run required type analysis
        run: basedpyright

  build:
    name: Build release distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83" build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_args=(
            "$GITHUB_REF_NAME"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
          )
          if [[ "$version" =~ [A-Za-z] ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
