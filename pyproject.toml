[project]
name = "qbitunregistered"
version = "2.3.0"
description = "Automated qBittorrent management tool for handling orphaned files, unregistered torrents, and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kha-kis" },
]
requires-python = ">=3.11"
keywords = ["qbittorrent", "torrent", "automation", "maintenance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "qbittorrent-api>=2026.5.3",  # API-key authentication support
    "schedule>=1.2.0",
    "tqdm>=4.66.3",  # Security fix for CLI injection vulnerability
    "apprise>=1.9,<2",
]

[project.scripts]
qbitunregistered = "qbitunregistered.cli:main"
qbitunregistered-scheduler = "qbitunregistered.scheduler:main"

[project.urls]
Homepage = "https://github.com/Kha-kis/qbitunregistered"
Documentation = "https://github.com/Kha-kis/qbitunregistered#readme"
Issues = "https://github.com/Kha-kis/qbitunregistered/issues"
Changelog = "https://github.com/Kha-kis/qbitunregistered/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "basedpyright>=1.31.4",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qbitunregistered*"]

[tool.black]
line-length = 127
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | web
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "web/",
    "venv/",
    ".venv/",
]

[tool.basedpyright]
include = ["qbitunregistered", "benchmarks", "tests"]
exclude = [
    "build",
    "dist",
    "venv",
    ".venv",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --disable-warnings -m \"not gauntlet_full\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gauntlet_full: runs the 12,000-torrent/94,000-file evaluator profile explicitly",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests",
]

[tool.coverage.run]
omit = [
    "qbitunregistered/__main__.py",
    "qbitunregistered/scheduler.py",
    "tests/*",               # Test files
    "*/venv/*",              # Virtual environments
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
