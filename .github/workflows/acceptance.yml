name: qBittorrent acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/acceptance.yml"
      - "scripts/run-qbittorrent-acceptance.sh"
      - "qbitunregistered/**"
      - "config.json.example"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Verify dry-run against qBittorrent 5.2.3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install the locked development environment
        run: uv sync --extra dev --frozen
      - name: Run disposable qBittorrent acceptance test
        run: ./scripts/run-qbittorrent-acceptance.sh
