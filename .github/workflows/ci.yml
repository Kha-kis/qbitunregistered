name: CI

on:
  push:
    branches: [main, "feature/**", "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - name: Check fatal Flake8 errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv/
      - name: Report remaining Flake8 findings
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv/
      - name: Check formatting
        run: black --check .
      - name: Run advisory type checking
        run: mypy qbitunregistered --ignore-missing-imports
        continue-on-error: true

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=qbitunregistered --cov-report=xml --cov-report=term-missing --cov-fail-under=60
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83" build
      - run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Test installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          qbitunregistered --help
          qbitunregistered-scheduler --help
          python -c "from qbitunregistered.config import validate_config; print('package import works')"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e . bandit pip-audit
      - name: Audit dependencies
        run: pip-audit
      - name: Scan application
        run: bandit -r qbitunregistered -ll
